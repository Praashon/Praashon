name: Refresh Profile Overview

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-overview:
    name: Update Activity & Language Overview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render overview SVGs
        run: python scripts/update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/overview-dark.svg assets/overview-light.svg; then
            git add assets/overview-dark.svg assets/overview-light.svg
            git commit -m "chore: refresh activity overview"
            git push
          fi
