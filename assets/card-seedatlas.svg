<svg xmlns="http://www.w3.org/2000/svg" width="468" height="196" viewBox="0 0 468 196" fill="none" role="img" aria-label="seedatlas — WEBASSEMBLY · C SYSTEMS">
  <defs>
    <clipPath id="c-seed">
      <rect x="2" y="2" width="464" height="192" rx="14"/>
    </clipPath>
    <linearGradient id="bg-seed" x1="0" y1="0" x2="468" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0e1628"/>
    </linearGradient>
    <radialGradient id="glow-seed" cx="0.86" cy="0.28" r="0.52">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#84cc16" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-seed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-seed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="f-seed" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#c-seed)">
    <rect x="2" y="2" width="464" height="192" fill="url(#bg-seed)"/>
    <rect x="2" y="2" width="464" height="192" fill="url(#glow-seed)"/>

    <!-- Animated Top Laser Bar -->
    <rect x="-180" y="2" width="180" height="2.4" fill="url(#bar-seed)">
      <animate attributeName="x" values="-180;468" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Category Kicker -->
    <circle cx="29" cy="27" r="3.2" fill="#555555">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="39" y="30.5" class="mono" font-size="10" font-weight="700" fill="#10b981" letter-spacing="1.1">WEBASSEMBLY · C SYSTEMS</text>

    <!-- Repo Title -->
    <text x="24" y="60" class="sans" font-size="21" font-weight="800" fill="url(#title-seed)" letter-spacing="-0.3">seedatlas</text>

    <!-- Description -->
    <text x="24" y="86" class="sans" font-size="12.5" fill="#94a3b8">Private browser-native Minecraft Java world atlas.</text>
    <text x="24" y="105" class="sans" font-size="12.5" fill="#94a3b8">Real biome sampling &amp; structure predictions via</text>
    <text x="24" y="124" class="sans" font-size="12.5" fill="#94a3b8">Cubiomes compiled to WebAssembly — zero backend.</text>

    <!-- Subtle separator -->
    <line x1="24" y1="142" x2="444" y2="142" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Pills -->
    <rect x="24" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.32" stroke-width="1"/><text x="51.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">C</text>
    <rect x="86" y="154" width="72" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.32" stroke-width="1"/><text x="122.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">CUBIOMES</text>
    <rect x="166" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.32" stroke-width="1"/><text x="193.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">WASM</text>
    <rect x="228" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.32" stroke-width="1"/><text x="255.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">ATLAS</text>

    <!-- Right Language & Status -->
    <text x="444" y="169" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#e2e8f0">C / WASM ↗</text>

    <!-- BESPOKE ANIMATED WIDGET (Top-Right 88x88 Arena) -->
    <g transform="translate(362, 22)">
      <rect x="0" y="0" width="84" height="84" rx="12" fill="#060a14" fill-opacity="0.78" stroke="#10b981" stroke-opacity="0.24" stroke-width="1"/>
      
      <!-- Biome Hex Grid -->
      <g stroke-width="1.2">
        <polygon points="42,27 53,33.5 53,46.5 42,53 31,46.5 31,33.5" fill="#10b981" fill-opacity="0.28" stroke="#34d399">
          <animate attributeName="fill-opacity" values="0.18;0.52;0.18" dur="2.8s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="42,10 53,16.5 53,27 42,33 31,27 31,16.5" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.55">
          <animate attributeName="fill-opacity" values="0.12;0.40;0.12" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="56,19 67,25.5 67,38 56,44 45,38 45,25.5" fill="#84cc16" fill-opacity="0.16" stroke="#a3e635" stroke-opacity="0.5">
          <animate attributeName="fill-opacity" values="0.12;0.38;0.12" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="28,19 39,25.5 39,38 28,44 17,38 17,25.5" fill="#14b8a6" fill-opacity="0.18" stroke="#2dd4bf" stroke-opacity="0.5">
          <animate attributeName="fill-opacity" values="0.12;0.42;0.12" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="56,45 67,51.5 67,64 56,70 45,64 45,51.5" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.5">
          <animate attributeName="fill-opacity" values="0.10;0.36;0.10" dur="3.5s" begin="0.2s" repeatCount="indefinite"/>
        </polygon>
        <polygon points="28,45 39,51.5 39,64 28,70 17,64 17,51.5" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.45">
          <animate attributeName="fill-opacity" values="0.10;0.34;0.10" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <!-- Scanning Survey Line -->
      <line x1="10" y1="16" x2="74" y2="16" stroke="#34d399" stroke-width="1.4" filter="url(#f-seed)">
        <animate attributeName="y1" values="12;72;12" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="12;72;12" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <circle cx="42" cy="40" r="2.5" fill="#f8fafc"/>
    
    </g>
  </g>

  <rect x="2" y="2" width="464" height="192" rx="14" stroke="#1e293b" stroke-width="1.2"/>
</svg>
