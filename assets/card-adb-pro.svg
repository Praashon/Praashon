<svg xmlns="http://www.w3.org/2000/svg" width="468" height="196" viewBox="0 0 468 196" fill="none" role="img" aria-label="adb-install-script-v2 — DESKTOP · ELECTRON &amp; ADB">
  <defs>
    <clipPath id="c-adb">
      <rect x="2" y="2" width="464" height="192" rx="14"/>
    </clipPath>
    <linearGradient id="bg-adb" x1="0" y1="0" x2="468" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0e1628"/>
    </linearGradient>
    <radialGradient id="glow-adb" cx="0.86" cy="0.28" r="0.52">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-adb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-adb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="f-adb" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#c-adb)">
    <rect x="2" y="2" width="464" height="192" fill="url(#bg-adb)"/>
    <rect x="2" y="2" width="464" height="192" fill="url(#glow-adb)"/>

    <!-- Animated Top Laser Bar -->
    <rect x="-180" y="2" width="180" height="2.4" fill="url(#bar-adb)">
      <animate attributeName="x" values="-180;468" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Category Kicker -->
    <circle cx="29" cy="27" r="3.2" fill="#3178c6">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="39" y="30.5" class="mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.1">DESKTOP · ELECTRON &amp; ADB</text>

    <!-- Repo Title -->
    <text x="24" y="60" class="sans" font-size="21" font-weight="800" fill="url(#title-adb)" letter-spacing="-0.3">adb-install-script-v2</text>

    <!-- Description -->
    <text x="24" y="86" class="sans" font-size="12.5" fill="#94a3b8">Windows desktop studio for Android devices.</text>
    <text x="24" y="105" class="sans" font-size="12.5" fill="#94a3b8">Drag-drop APK installs, built-in SCRCPY screen</text>
    <text x="24" y="124" class="sans" font-size="12.5" fill="#94a3b8">mirroring, wireless ADB, security audit &amp; logcat.</text>

    <!-- Subtle separator -->
    <line x1="24" y1="142" x2="444" y2="142" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Pills -->
    <rect x="24" y="154" width="72" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1"/><text x="60.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">ELECTRON</text>
    <rect x="104" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1"/><text x="131.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">ADB</text>
    <rect x="166" y="154" width="58" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1"/><text x="195.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">SCRCPY</text>

    <!-- Right Language & Status -->
    <text x="444" y="169" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#e2e8f0">★ 2 · TS ↗</text>

    <!-- BESPOKE ANIMATED WIDGET (Top-Right 88x88 Arena) -->
    <g transform="translate(362, 22)">
      <rect x="0" y="0" width="84" height="84" rx="12" fill="#060a14" fill-opacity="0.78" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="1"/>
      
      <!-- Phone Frame (Left) -->
      <rect x="12" y="24" width="20" height="36" rx="4" fill="#0c1930" stroke="#38bdf8" stroke-width="1.4"/>
      <rect x="15" y="29" width="14" height="24" rx="1.5" fill="#38bdf8" fill-opacity="0.18"/>
      <circle cx="22" cy="56.5" r="1.4" fill="#38bdf8"/>

      <!-- Desktop Monitor (Right) -->
      <rect x="48" y="22" width="26" height="24" rx="3" fill="#0c1930" stroke="#818cf8" stroke-width="1.4"/>
      <rect x="51" y="25" width="20" height="17" rx="1.5" fill="#818cf8" fill-opacity="0.2"/>
      <line x1="56" y1="51" x2="66" y2="51" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="61" y1="46" x2="61" y2="51" stroke="#818cf8" stroke-width="1.4"/>

      <!-- Curved Data Bridge Paths -->
      <path id="adb-p1" d="M 32 34 Q 40 20 48 30" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 2"/>
      <path id="adb-p2" d="M 48 40 Q 40 54 32 46" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 2"/>

      <!-- Animated Data Packets -->
      <circle r="2.8" fill="#34d399" filter="url(#f-adb)">
        <animateMotion dur="1.7s" repeatCount="indefinite" path="M 32 34 Q 40 20 48 30"/>
      </circle>
      <circle r="2.5" fill="#38bdf8" filter="url(#f-adb)">
        <animateMotion dur="1.9s" repeatCount="indefinite" path="M 48 40 Q 40 54 32 46"/>
      </circle>

      <!-- Live Signal Pulse at Bottom -->
      <path d="M 34 68 Q 42 62 50 68" stroke="#34d399" stroke-width="1.3" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 37 72 Q 42 68 47 72" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" fill="none">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    
    </g>
  </g>

  <rect x="2" y="2" width="464" height="192" rx="14" stroke="#1e293b" stroke-width="1.2"/>
</svg>
