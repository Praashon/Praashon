<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20" fill="none" role="presentation">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .fade { animation: fIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
    .line { stroke-dasharray: 724; stroke-dashoffset: 724; animation: lIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; }
    @keyframes fIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lIn { to { stroke-dashoffset: 0; } }
  </style>
  <text x="2" y="14" class="mono fade" font-size="10.5" font-weight="500" fill="#6e7681" letter-spacing="1.6">02  /  SELECTED WORK</text>
  <line x1="176" y1="10.5" x2="898" y2="10.5" stroke="#21262d" stroke-width="1" class="line"/>
</svg>
