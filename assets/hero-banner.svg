<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none" role="img" aria-label="Praashon Gautam — Systems, Full-Stack and AI Engineer">
  <defs>
    <clipPath id="hero-clip">
      <rect x="4" y="4" width="952" height="292" rx="18"/>
    </clipPath>

    <linearGradient id="hero-bg" x1="0" y1="0" x2="960" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="52%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <radialGradient id="aurora-cyan" cx="0.22" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-emerald" cx="0.82" cy="0.48" r="0.48">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-violet" cx="0.50" cy="0.95" r="0.50">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name-grad" x1="-300" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="28%" stop-color="#7dd3fc"/>
      <stop offset="52%" stop-color="#34d399"/>
      <stop offset="76%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-350;550;-350" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="550;1450;550" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="comet-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="eq-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cmd-reveal">
      <rect x="76" y="186" width="495" height="32">
        <animate attributeName="width" values="0;495;495;495;0" keyTimes="0;0.20;0.88;0.95;1" dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .twinkle-a { animation: twinkle 3.6s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 4.8s ease-in-out 1.4s infinite; }
    .twinkle-c { animation: twinkle 2.9s ease-in-out 0.7s infinite; }
    .blink { animation: blink 1.05s steps(1) infinite; }
    .border-comet {
      stroke-dasharray: 290 2198;
      animation: orbitBorder 8.5s linear infinite;
    }
    .border-comet-2 {
      stroke-dasharray: 180 2308;
      animation: orbitBorder 8.5s linear -4.25s infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.95; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes orbitBorder {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -2488; }
    }
  </style>

  <!-- Clipped Interior -->
  <g clip-path="url(#hero-clip)">
    <!-- Base Obsidian Backdrop -->
    <rect x="4" y="4" width="952" height="292" fill="url(#hero-bg)"/>

    <!-- Breathing Aurora Nebulas -->
    <ellipse cx="210" cy="70" rx="340" ry="180" fill="url(#aurora-cyan)">
      <animate attributeName="cx" values="190;265;190" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.78;1;0.78" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="785" cy="145" rx="280" ry="175" fill="url(#aurora-emerald)">
      <animate attributeName="cy" values="130;170;130" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="480" cy="285" rx="330" ry="145" fill="url(#aurora-violet)">
      <animate attributeName="cx" values="430;540;430" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Subtle Cyber Grid -->
    <g stroke="#38bdf8" stroke-opacity="0.055" stroke-width="1">
      <line x1="4" y1="60" x2="956" y2="60"/>
      <line x1="4" y1="120" x2="956" y2="120"/>
      <line x1="4" y1="180" x2="956" y2="180"/>
      <line x1="4" y1="240" x2="956" y2="240"/>
      <line x1="120" y1="4" x2="120" y2="296"/>
      <line x1="240" y1="4" x2="240" y2="296"/>
      <line x1="360" y1="4" x2="360" y2="296"/>
      <line x1="480" y1="4" x2="480" y2="296"/>
      <line x1="600" y1="4" x2="600" y2="296"/>
      <line x1="720" y1="4" x2="720" y2="296"/>
      <line x1="840" y1="4" x2="840" y2="296"/>
    </g>

    <!-- Slow Horizontal Scanline -->
    <rect x="4" y="0" width="952" height="2" fill="#38bdf8" fill-opacity="0.16">
      <animate attributeName="y" values="4;296" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Diagonal Light Sheen -->
    <rect x="-260" y="0" width="210" height="320" fill="url(#sheen-grad)" transform="skewX(-22)">
      <animate attributeName="x" values="-260;1280" dur="8.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Twinkling Starfield -->
    <g fill="#e2e8f0">
      <circle cx="88" cy="24" r="1.2" class="twinkle-a"/>
      <circle cx="290" cy="34" r="1.1" class="twinkle-b"/>
      <circle cx="445" cy="28" r="1.5" fill="#7dd3fc" class="twinkle-c"/>
      <circle cx="568" cy="48" r="1.1" class="twinkle-a"/>
      <circle cx="628" cy="112" r="1.4" fill="#34d399" class="twinkle-b"/>
      <circle cx="645" cy="244" r="1.2" class="twinkle-c"/>
      <circle cx="585" cy="272" r="1.1" class="twinkle-a"/>
      <circle cx="924" cy="44" r="1.5" fill="#c4b5fd" class="twinkle-b"/>
      <circle cx="912" cy="252" r="1.3" fill="#7dd3fc" class="twinkle-c"/>
      <circle cx="34" cy="268" r="1.1" class="twinkle-b"/>
      <circle cx="385" cy="278" r="1.2" fill="#34d399" class="twinkle-a"/>
      <circle cx="672" cy="32" r="1.1" class="twinkle-c"/>
    </g>

    <!-- Floating Ambient Code Glyphs -->
    <g class="mono" font-size="11" fill="#38bdf8" fill-opacity="0.13">
      <text x="588" y="82">fn verify()</text>
      <text x="598" y="164">0x10000</text>
      <text x="612" y="218">::wasm</text>
    </g>

    <!-- LEFT EDITORIAL CONTENT -->
    <!-- Live Status Pill -->
    <g>
      <rect x="44" y="30" width="308" height="28" rx="14" fill="#0d1628" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1"/>
      <circle cx="62" cy="44" r="3.5" fill="#34d399">
        <animate attributeName="r" values="3.5;10;3.5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0;0.85" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="44" r="3.5" fill="#34d399"/>
      <text x="76" y="48" class="mono" font-size="10.5" font-weight="600" fill="#cbd5e1" letter-spacing="1.0">KATHMANDU, NEPAL · BUILDING &amp; SHIPPING</text>
    </g>

    <!-- Shimmering Display Title (subtle backlit glow + razor-sharp crisp text on top) -->
    <text x="44" y="122" class="sans" font-size="48" font-weight="800" letter-spacing="-0.8" fill="url(#name-grad)" opacity="0.28" filter="url(#glow-soft)">PRAASHON GAUTAM</text>
    <text x="44" y="122" class="sans" font-size="48" font-weight="800" letter-spacing="-0.8" fill="url(#name-grad)">PRAASHON GAUTAM</text>

    <!-- Role Subtitle -->
    <text x="46" y="156" class="sans" font-size="16.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">Systems, Full-Stack &amp; AI Engineer  <tspan fill="#38bdf8">·</tspan>  Visual Designer</text>

    <!-- Kinetic Terminal Bar -->
    <g>
      <rect x="44" y="180" width="546" height="36" rx="9" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
      <rect x="44" y="180" width="4" height="36" rx="2" fill="#38bdf8" fill-opacity="0.75"/>
      <text x="58" y="202.5" class="mono" font-size="13" font-weight="700" fill="#34d399">$</text>
      <!-- Faint persistent ghost text so it's readable even during reset -->
      <text x="76" y="202.5" class="mono" font-size="12.5" fill="#334155">craft --focus "Rust VMs · C/WASM · Next.js · Electron · AI"</text>
      <!-- Animated typing reveal layer -->
      <g clip-path="url(#cmd-reveal)">
        <text x="76" y="202.5" class="mono" font-size="12.5" fill="#e2e8f0">craft <tspan fill="#38bdf8">--focus</tspan> <tspan fill="#a7f3d0">"Rust VMs · C/WASM · Next.js · Electron · AI"</tspan></text>
      </g>
      <rect x="571" y="191" width="8" height="14" rx="1.5" fill="#38bdf8" class="blink"/>
    </g>

    <!-- Bottom Highlight Pills -->
    <g class="mono" font-size="11" font-weight="600">
      <rect x="44" y="234" width="154" height="28" rx="7" fill="#0d1729" stroke="#38bdf8" stroke-opacity="0.28"/>
      <text x="60" y="252" fill="#7dd3fc">◈  50+ PUBLIC REPOS</text>

      <rect x="208" y="234" width="194" height="28" rx="7" fill="#0d1729" stroke="#34d399" stroke-opacity="0.28"/>
      <text x="224" y="252" fill="#6ee7b7">⚡ RUST · WASM · TS · AI</text>

      <rect x="412" y="234" width="158" height="28" rx="7" fill="#0d1729" stroke="#a78bfa" stroke-opacity="0.30"/>
      <text x="428" y="252" fill="#c4b5fd">↗  PRASHON.COM.NP</text>
    </g>

    <!-- RIGHT KINETIC ORBITAL TELEMETRY RIG -->
    <g transform="translate(792, 134)">
      <!-- Subtle Crosshair -->
      <line x1="-112" y1="0" x2="112" y2="0" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="0" y1="-112" x2="0" y2="112" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>

      <!-- Rotating Radar Sweep Cone -->
      <g>
        <path d="M 0 0 L 0 -92 A 92 92 0 0 1 79.6 -46 Z" fill="url(#radar-sweep)"/>
        <line x1="0" y1="0" x2="0" y2="-92" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5.5s" repeatCount="indefinite"/>
      </g>

      <!-- Outer Orbiting Ring (CW) -->
      <g>
        <circle cx="0" cy="0" r="94" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6 7"/>
        <circle cx="94" cy="0" r="4" fill="#38bdf8" filter="url(#glow-soft)"/>
        <circle cx="-94" cy="0" r="3" fill="#34d399" filter="url(#glow-soft)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      </g>

      <!-- Mid Orbiting Ring (CCW) -->
      <g>
        <circle cx="0" cy="0" r="68" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="32 18 10 18"/>
        <circle cx="0" cy="-68" r="3.6" fill="#a78bfa" filter="url(#glow-soft)"/>
        <circle cx="0" cy="68" r="2.8" fill="#f97316" filter="url(#glow-soft)"/>
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
      </g>

      <!-- Inner Pulse Ring -->
      <circle cx="0" cy="0" r="42" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.2">
        <animate attributeName="r" values="40;46;40" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.22;0.55;0.22" dur="3.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Rotating Hex Core -->
      <g>
        <polygon points="0,-29 25,-14.5 25,14.5 0,29 -25,14.5 -25,-14.5" fill="#0b1325" stroke="url(#hex-grad)" stroke-width="2" filter="url(#glow-soft)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>

      <!-- Upright Center Monogram -->
      <text x="0" y="6" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="1">PG</text>

      <!-- Corner HUD Micro-Tags -->
      <g class="mono" font-size="9.5" font-weight="700" letter-spacing="0.8">
        <text x="-106" y="-84" fill="#fb923c">RUST VM</text>
        <text x="58" y="-84" fill="#34d399">C/WASM</text>
        <text x="-106" y="96" fill="#7dd3fc">NEXT.JS</text>
        <text x="64" y="96" fill="#c4b5fd">AI / UX</text>
      </g>
    </g>

    <!-- Live Kinetic Spectrum Equalizer (Bottom Right) -->
    <g transform="translate(706, 250)">
      <rect x="0" y="14" width="6" height="12" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="8;24;10;20;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="18;2;16;6;18" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="14" y="8" width="6" height="18" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="18;6;26;12;18" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="8;20;0;14;8" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="28" y="4" width="6" height="22" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="12;26;8;22;12" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;18;4;14" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="42" y="10" width="6" height="16" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="22;10;24;6;22" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="4;16;2;20;4" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="56" y="6" width="6" height="20" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="8;22;14;26;8" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="18;4;12;0;18" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="70" y="12" width="6" height="14" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="26;12;20;8;26" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="0;14;6;18;0" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="84" y="4" width="6" height="22" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="14;26;6;18;14" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="12;0;20;8;12" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="98" y="10" width="6" height="16" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="20;8;24;12;20" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="6;18;2;14;6" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="112" y="6" width="6" height="20" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="10;24;12;26;10" dur="2.0s" repeatCount="indefinite"/><animate attributeName="y" values="16;2;14;0;16" dur="2.0s" repeatCount="indefinite"/></rect>
      <rect x="126" y="12" width="6" height="14" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="24;10;18;6;24" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="2;16;8;20;2" dur="1.55s" repeatCount="indefinite"/></rect>
      <rect x="140" y="8" width="6" height="18" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="12;22;8;24;12" dur="1.75s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;18;2;14" dur="1.75s" repeatCount="indefinite"/></rect>
      <rect x="154" y="14" width="6" height="12" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="16;6;22;10;16" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="10;20;4;16;10" dur="1.45s" repeatCount="indefinite"/></rect>
      <rect x="168" y="10" width="6" height="16" rx="3" fill="url(#eq-grad)"><animate attributeName="height" values="8;20;12;24;8" dur="1.85s" repeatCount="indefinite"/><animate attributeName="y" values="18;6;14;2;18" dur="1.85s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Crisp Static Frame + Dual Orbiting Neon Border Comets -->
  <rect x="4" y="4" width="952" height="292" rx="18" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="4" y="4" width="952" height="292" rx="18" stroke="url(#comet-stroke)" stroke-width="2" class="border-comet"/>
  <rect x="4" y="4" width="952" height="292" rx="18" stroke="url(#comet-stroke)" stroke-width="1.5" stroke-opacity="0.55" class="border-comet-2"/>
</svg>
