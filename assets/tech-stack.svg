<svg xmlns="http://www.w3.org/2000/svg" width="960" height="274" viewBox="0 0 960 274" fill="none" role="img" aria-label="Engineering Stack and Architecture Matrix">
  <defs>
    <clipPath id="ts-clip">
      <rect x="4" y="4" width="952" height="266" rx="16"/>
    </clipPath>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="960" y2="274" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="ts-hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="ts-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#ts-clip)">
    <rect x="4" y="4" width="952" height="266" fill="url(#ts-bg)"/>

    <!-- Header Strip -->
    <text x="26" y="29" class="mono" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.4">ENGINEERING MATRIX  <tspan fill="#38bdf8">//</tspan>  MULTI-DOMAIN ARCHITECTURE</text>
    <circle cx="838" cy="25" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="848" y="29" class="mono" font-size="10.5" fill="#6ee7b7" letter-spacing="0.8">BUS ACTIVE</text>
    <line x1="24" y1="39" x2="936" y2="39" stroke="#1e293b" stroke-width="1"/>

    <!-- Center Circuit Traces -->
    <g stroke-width="1.4" fill="none">
      <path d="M 436 98 L 456 98 L 470 135" stroke="#f97316" stroke-opacity="0.45"/>
      <path d="M 524 98 L 504 98 L 490 135" stroke="#38bdf8" stroke-opacity="0.45"/>
      <path d="M 436 206 L 456 206 L 470 169" stroke="#10b981" stroke-opacity="0.45"/>
      <path d="M 524 206 L 504 206 L 490 169" stroke="#a855f7" stroke-opacity="0.45"/>
    </g>

    <!-- Traveling Neon Data Packets Along Circuit Traces -->
    <circle r="3" fill="#fb923c" filter="url(#ts-glow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 436 98 L 456 98 L 470 135"/>
    </circle>
    <circle r="3" fill="#38bdf8" filter="url(#ts-glow)">
      <animateMotion dur="2.0s" begin="0.4s" repeatCount="indefinite" path="M 524 98 L 504 98 L 490 135"/>
    </circle>
    <circle r="3" fill="#34d399" filter="url(#ts-glow)">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 436 206 L 456 206 L 470 169"/>
    </circle>
    <circle r="3" fill="#c084fc" filter="url(#ts-glow)">
      <animateMotion dur="2.1s" begin="1.2s" repeatCount="indefinite" path="M 524 206 L 504 206 L 490 169"/>
    </circle>

    <!-- Center Energy Hub -->
    <g transform="translate(480, 152)">
      <circle cx="0" cy="0" r="46" fill="url(#ts-hub-glow)"/>
      <g>
        <circle cx="0" cy="0" r="24" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="10 6"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </g>
      <g>
        <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#0b1326" stroke="#34d399" stroke-width="1.5" filter="url(#ts-glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="4.2" fill="#38bdf8">
        <animate attributeName="r" values="3.4;5.2;3.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- QUADRANT 1: SYSTEMS & LOW-LEVEL (Top-Left) -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="412" height="94" rx="12" fill="#0c1324" stroke="#f97316" stroke-opacity="0.28" stroke-width="1.1"/>
      <rect x="0" y="14" width="3.5" height="66" rx="1.75" fill="#f97316"/>
      <text x="18" y="25" class="mono" font-size="10.5" font-weight="700" fill="#fb923c" letter-spacing="1">01 // SYSTEMS &amp; LOW-LEVEL</text>
      <text x="18" y="45" class="sans" font-size="12" fill="#94a3b8">Compilers, VMs, WebAssembly &amp; native Windows telemetry</text>
      <g class="mono" font-size="10.5" font-weight="600" fill="#e2e8f0">
        <rect x="18" y="58" width="48" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="42" y="73" text-anchor="middle">Rust</text>
        <rect x="73" y="58" width="34" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="90" y="73" text-anchor="middle">C</text>
        <rect x="114" y="58" width="54" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="141" y="73" text-anchor="middle">WASM</text>
        <rect x="175" y="58" width="40" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="195" y="73" text-anchor="middle">C#</text>
        <rect x="222" y="58" width="64" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="254" y="73" text-anchor="middle">Python</text>
        <rect x="293" y="58" width="76" height="23" rx="6" fill="#171217" stroke="#f97316" stroke-opacity="0.45"/><text x="331" y="73" text-anchor="middle">Solidity</text>
      </g>
    </g>

    <!-- QUADRANT 2: FRONTEND & KINETIC UI (Top-Right) -->
    <g transform="translate(524, 52)">
      <rect x="0" y="0" width="412" height="94" rx="12" fill="#0c1324" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.1"/>
      <rect x="408.5" y="14" width="3.5" height="66" rx="1.75" fill="#38bdf8"/>
      <text x="18" y="25" class="mono" font-size="10.5" font-weight="700" fill="#7dd3fc" letter-spacing="1">02 // FRONTEND &amp; KINETIC UI</text>
      <text x="18" y="45" class="sans" font-size="12" fill="#94a3b8">Framer Motion, GSAP, 3D WebGL &amp; visual brand systems</text>
      <g class="mono" font-size="10.5" font-weight="600" fill="#e2e8f0">
        <rect x="18" y="58" width="84" height="23" rx="6" fill="#0d192b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="60" y="73" text-anchor="middle">TypeScript</text>
        <rect x="109" y="58" width="54" height="23" rx="6" fill="#0d192b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="136" y="73" text-anchor="middle">React</text>
        <rect x="170" y="58" width="66" height="23" rx="6" fill="#0d192b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="203" y="73" text-anchor="middle">Next.js</text>
        <rect x="243" y="58" width="72" height="23" rx="6" fill="#0d192b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="279" y="73" text-anchor="middle">Tailwind</text>
        <rect x="322" y="58" width="72" height="23" rx="6" fill="#0d192b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="358" y="73" text-anchor="middle">Three.js</text>
      </g>
    </g>

    <!-- QUADRANT 3: BACKEND, DATA & AI (Bottom-Left) -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="412" height="94" rx="12" fill="#0c1324" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.1"/>
      <rect x="0" y="14" width="3.5" height="66" rx="1.75" fill="#10b981"/>
      <text x="18" y="25" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7" letter-spacing="1">03 // BACKEND, DATA &amp; AI</text>
      <text x="18" y="45" class="sans" font-size="12" fill="#94a3b8">Gemini &amp; OpenRouter pipelines, Redis caching &amp; WebSockets</text>
      <g class="mono" font-size="10.5" font-weight="600" fill="#e2e8f0">
        <rect x="18" y="58" width="66" height="23" rx="6" fill="#0b1c1c" stroke="#10b981" stroke-opacity="0.45"/><text x="51" y="73" text-anchor="middle">Node.js</text>
        <rect x="91" y="58" width="66" height="23" rx="6" fill="#0b1c1c" stroke="#10b981" stroke-opacity="0.45"/><text x="124" y="73" text-anchor="middle">FastAPI</text>
        <rect x="164" y="58" width="72" height="23" rx="6" fill="#0b1c1c" stroke="#10b981" stroke-opacity="0.45"/><text x="200" y="73" text-anchor="middle">Postgres</text>
        <rect x="243" y="58" width="72" height="23" rx="6" fill="#0b1c1c" stroke="#10b981" stroke-opacity="0.45"/><text x="279" y="73" text-anchor="middle">Supabase</text>
        <rect x="322" y="58" width="56" height="23" rx="6" fill="#0b1c1c" stroke="#10b981" stroke-opacity="0.45"/><text x="350" y="73" text-anchor="middle">Redis</text>
      </g>
    </g>

    <!-- QUADRANT 4: DESKTOP & WORKFLOW (Bottom-Right) -->
    <g transform="translate(524, 160)">
      <rect x="0" y="0" width="412" height="94" rx="12" fill="#0c1324" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1.1"/>
      <rect x="408.5" y="14" width="3.5" height="66" rx="1.75" fill="#a855f7"/>
      <text x="18" y="25" class="mono" font-size="10.5" font-weight="700" fill="#d8b4fe" letter-spacing="1">04 // DESKTOP &amp; TOOLING</text>
      <text x="18" y="45" class="sans" font-size="12" fill="#94a3b8">Windows desktop studios, Chrome MV3 extensions &amp; CI/CD</text>
      <g class="mono" font-size="10.5" font-weight="600" fill="#e2e8f0">
        <rect x="18" y="58" width="74" height="23" rx="6" fill="#171127" stroke="#a855f7" stroke-opacity="0.45"/><text x="55" y="73" text-anchor="middle">Electron</text>
        <rect x="99" y="58" width="46" height="23" rx="6" fill="#171127" stroke="#a855f7" stroke-opacity="0.45"/><text x="122" y="73" text-anchor="middle">ADB</text>
        <rect x="152" y="58" width="66" height="23" rx="6" fill="#171127" stroke="#a855f7" stroke-opacity="0.45"/><text x="185" y="73" text-anchor="middle">SCRCPY</text>
        <rect x="225" y="58" width="70" height="23" rx="6" fill="#171127" stroke="#a855f7" stroke-opacity="0.45"/><text x="260" y="73" text-anchor="middle">Actions</text>
        <rect x="302" y="58" width="58" height="23" rx="6" fill="#171127" stroke="#a855f7" stroke-opacity="0.45"/><text x="331" y="73" text-anchor="middle">Linux</text>
      </g>
    </g>
  </g>

  <rect x="4" y="4" width="952" height="266" rx="16" stroke="#1e293b" stroke-width="1.2"/>
</svg>
