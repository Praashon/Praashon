<svg xmlns="http://www.w3.org/2000/svg" width="960" height="132" viewBox="0 0 960 132" fill="none" role="img" aria-label="Footer wave — Crafted by Praashon Gautam">
  <defs>
    <clipPath id="fw-clip">
      <rect x="4" y="4" width="952" height="124" rx="16"/>
    </clipPath>
    <linearGradient id="fw-bg" x1="0" y1="0" x2="960" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fw-text" x1="200" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#fw-clip)">
    <rect x="4" y="4" width="952" height="124" fill="url(#fw-bg)"/>

    <!-- Floating Stardust Particles -->
    <g fill="#7dd3fc">
      <circle cx="130" cy="36" r="1.4"><animate attributeName="cy" values="80;18" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="285" cy="52" r="1.2" fill="#34d399"><animate attributeName="cy" values="92;22" dur="6.4s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="40" r="1.5" fill="#c4b5fd"><animate attributeName="cy" values="88;16" dur="4.8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="4.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="670" cy="46" r="1.3"><animate attributeName="cy" values="90;20" dur="5.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="5.8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="835" cy="38" r="1.4" fill="#34d399"><animate attributeName="cy" values="84;18" dur="4.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="4.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Back Wave (Slowest, Seamless 960px Loop) -->
    <g>
      <path d="M 0 84 Q 240 54 480 84 T 960 84 T 1440 84 T 1920 84 L 1920 136 L 0 136 Z" fill="url(#wave1)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Mid Wave (Opposite Direction, Seamless 960px Loop) -->
    <g>
      <path d="M 0 94 Q 240 68 480 94 T 960 94 T 1440 94 T 1920 94 L 1920 136 L 0 136 Z" fill="url(#wave2)"/>
      <animateTransform attributeName="transform" type="translate" from="-960 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Front Luminous Crest Wave -->
    <g>
      <path d="M 0 104 Q 240 82 480 104 T 960 104 T 1440 104 T 1920 104 L 1920 136 L 0 136 Z" fill="url(#wave3)"/>
      <path d="M 0 104 Q 240 82 480 104 T 960 104 T 1440 104 T 1920 104" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3" fill="none"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="7.5s" repeatCount="indefinite"/>
    </g>

    <!-- Centered Editorial Sign-off -->
    <text x="480" y="45" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="url(#fw-text)" letter-spacing="0.4">Building fast, deterministic systems &amp; kinetic web experiences.</text>
    <text x="480" y="69" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8" letter-spacing="1.6">PRAASHON GAUTAM  ·  KATHMANDU, NEPAL  ·  PRASHON.COM.NP</text>
  </g>

  <rect x="4" y="4" width="952" height="124" rx="16" stroke="#1e293b" stroke-width="1.2"/>
</svg>
