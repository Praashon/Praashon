<svg xmlns="http://www.w3.org/2000/svg" width="468" height="196" viewBox="0 0 468 196" fill="none" role="img" aria-label="RouterChat — AI INTERFACE · OPENROUTER">
  <defs>
    <clipPath id="c-rch">
      <rect x="2" y="2" width="464" height="192" rx="14"/>
    </clipPath>
    <linearGradient id="bg-rch" x1="0" y1="0" x2="468" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0e1628"/>
    </linearGradient>
    <radialGradient id="glow-rch" cx="0.86" cy="0.28" r="0.52">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-rch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-rch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="f-rch" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#c-rch)">
    <rect x="2" y="2" width="464" height="192" fill="url(#bg-rch)"/>
    <rect x="2" y="2" width="464" height="192" fill="url(#glow-rch)"/>

    <!-- Animated Top Laser Bar -->
    <rect x="-180" y="2" width="180" height="2.4" fill="url(#bar-rch)">
      <animate attributeName="x" values="-180;468" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Category Kicker -->
    <circle cx="29" cy="27" r="3.2" fill="#3178c6">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="39" y="30.5" class="mono" font-size="10" font-weight="700" fill="#f43f5e" letter-spacing="1.1">AI INTERFACE · OPENROUTER</text>

    <!-- Repo Title -->
    <text x="24" y="60" class="sans" font-size="21" font-weight="800" fill="url(#title-rch)" letter-spacing="-0.3">RouterChat</text>

    <!-- Description -->
    <text x="24" y="86" class="sans" font-size="12.5" fill="#94a3b8">Privacy-first BYOK multi-LLM chat on Next.js 15.</text>
    <text x="24" y="105" class="sans" font-size="12.5" fill="#94a3b8">Zero-downtime 429 failover engine seamlessly</text>
    <text x="24" y="124" class="sans" font-size="12.5" fill="#94a3b8">routing across Claude, GPT, Gemini &amp; Llama.</text>

    <!-- Subtle separator -->
    <line x1="24" y1="142" x2="444" y2="142" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Pills -->
    <rect x="24" y="154" width="86" height="22" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.32" stroke-width="1"/><text x="67.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">NEXT.JS 15</text>
    <rect x="118" y="154" width="86" height="22" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.32" stroke-width="1"/><text x="161.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">OPENROUTER</text>
    <rect x="212" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.32" stroke-width="1"/><text x="239.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">BYOK</text>

    <!-- Right Language & Status -->
    <text x="444" y="169" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#e2e8f0">LIVE · TS ↗</text>

    <!-- BESPOKE ANIMATED WIDGET (Top-Right 88x88 Arena) -->
    <g transform="translate(362, 22)">
      <rect x="0" y="0" width="84" height="84" rx="12" fill="#060a14" fill-opacity="0.78" stroke="#f43f5e" stroke-opacity="0.24" stroke-width="1"/>
      
      <!-- Mesh Links -->
      <line x1="20" y1="42" x2="62" y2="20" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.3"/>
      <line x1="20" y1="42" x2="66" y2="42" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.3"/>
      <line x1="20" y1="42" x2="62" y2="64" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.3"/>

      <!-- Routing Photons -->
      <circle r="2.6" fill="#fb7185" filter="url(#f-rch)">
        <animateMotion dur="2.1s" repeatCount="indefinite" path="M 20 42 L 62 20"/>
      </circle>
      <circle r="2.6" fill="#fbbf24" filter="url(#f-rch)">
        <animateMotion dur="1.8s" begin="0.5s" repeatCount="indefinite" path="M 20 42 L 66 42"/>
      </circle>
      <circle r="2.6" fill="#38bdf8" filter="url(#f-rch)">
        <animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M 20 42 L 62 64"/>
      </circle>

      <!-- Source Node -->
      <circle cx="20" cy="42" r="7" fill="#180d1c" stroke="#f43f5e" stroke-width="1.6"/>
      <circle cx="20" cy="42" r="2.8" fill="#fb7185">
        <animate attributeName="r" values="2.2;3.6;2.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Model Nodes -->
      <circle cx="62" cy="20" r="6" fill="#160f20" stroke="#fb7185" stroke-width="1.4"/>
      <circle cx="66" cy="42" r="6" fill="#181410" stroke="#fbbf24" stroke-width="1.4"/>
      <circle cx="62" cy="64" r="6" fill="#0d1729" stroke="#38bdf8" stroke-width="1.4"/>
    
    </g>
  </g>

  <rect x="2" y="2" width="464" height="192" rx="14" stroke="#1e293b" stroke-width="1.2"/>
</svg>
