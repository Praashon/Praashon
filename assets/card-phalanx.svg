<svg xmlns="http://www.w3.org/2000/svg" width="468" height="196" viewBox="0 0 468 196" fill="none" role="img" aria-label="phalanx — SYSTEMS · COMPILER &amp; VM">
  <defs>
    <clipPath id="c-phx">
      <rect x="2" y="2" width="464" height="192" rx="14"/>
    </clipPath>
    <linearGradient id="bg-phx" x1="0" y1="0" x2="468" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0e1628"/>
    </linearGradient>
    <radialGradient id="glow-phx" cx="0.86" cy="0.28" r="0.52">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-phx" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-phx" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="f-phx" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#c-phx)">
    <rect x="2" y="2" width="464" height="192" fill="url(#bg-phx)"/>
    <rect x="2" y="2" width="464" height="192" fill="url(#glow-phx)"/>

    <!-- Animated Top Laser Bar -->
    <rect x="-180" y="2" width="180" height="2.4" fill="url(#bar-phx)">
      <animate attributeName="x" values="-180;468" dur="4.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Category Kicker -->
    <circle cx="29" cy="27" r="3.2" fill="#dea584">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="39" y="30.5" class="mono" font-size="10" font-weight="700" fill="#f97316" letter-spacing="1.1">SYSTEMS · COMPILER &amp; VM</text>

    <!-- Repo Title -->
    <text x="24" y="60" class="sans" font-size="21" font-weight="800" fill="url(#title-phx)" letter-spacing="-0.3">phalanx</text>

    <!-- Description -->
    <text x="24" y="86" class="sans" font-size="12.5" fill="#94a3b8">Sandboxed autonomous bot battle arena in Rust.</text>
    <text x="24" y="105" class="sans" font-size="12.5" fill="#94a3b8">Custom .phx compiler, eBPF-style verifier, zero-</text>
    <text x="24" y="124" class="sans" font-size="12.5" fill="#94a3b8">alloc register VM &amp; deterministic Q16.16 physics.</text>

    <!-- Subtle separator -->
    <line x1="24" y1="142" x2="444" y2="142" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech Pills -->
    <rect x="24" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#f97316" stroke-opacity="0.32" stroke-width="1"/><text x="51.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">RUST</text>
    <rect x="86" y="154" width="72" height="22" rx="6" fill="#0f172a" stroke="#f97316" stroke-opacity="0.32" stroke-width="1"/><text x="122.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">COMPILER</text>
    <rect x="166" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#f97316" stroke-opacity="0.32" stroke-width="1"/><text x="193.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">VM</text>
    <rect x="228" y="154" width="54" height="22" rx="6" fill="#0f172a" stroke="#f97316" stroke-opacity="0.32" stroke-width="1"/><text x="255.0" y="168.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#cbd5e1">WASM</text>

    <!-- Right Language & Status -->
    <text x="444" y="169" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#e2e8f0">RUST ↗</text>

    <!-- BESPOKE ANIMATED WIDGET (Top-Right 88x88 Arena) -->
    <g transform="translate(362, 22)">
      <rect x="0" y="0" width="84" height="84" rx="12" fill="#060a14" fill-opacity="0.78" stroke="#f97316" stroke-opacity="0.24" stroke-width="1"/>
      
      <circle cx="42" cy="42" r="30" stroke="#f97316" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="42" cy="42" r="18" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="12" y1="42" x2="72" y2="42" stroke="#1e293b" stroke-width="0.8"/>
      <line x1="42" y1="12" x2="42" y2="72" stroke="#1e293b" stroke-width="0.8"/>
      <!-- Spinning radar sweep -->
      <g>
        <path d="M 42 42 L 42 12 A 30 30 0 0 1 68 27 Z" fill="#f97316" fill-opacity="0.22"/>
        <line x1="42" y1="42" x2="42" y2="12" stroke="#fb923c" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 42 42" to="360 42 42" dur="3.6s" repeatCount="indefinite"/>
      </g>
      <!-- Bot A orbiting -->
      <g>
        <circle cx="64" cy="42" r="3.4" fill="#f97316" filter="url(#f-phx)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 42 42" to="360 42 42" dur="5.2s" repeatCount="indefinite"/>
      </g>
      <!-- Bot B counter-orbiting -->
      <g>
        <circle cx="42" cy="24" r="3" fill="#38bdf8" filter="url(#f-phx)"/>
        <animateTransform attributeName="transform" type="rotate" from="360 42 42" to="0 42 42" dur="4.1s" repeatCount="indefinite"/>
      </g>
      <!-- Pulsing Core -->
      <circle cx="42" cy="42" r="3.2" fill="#f8fafc">
        <animate attributeName="r" values="2.6;4.2;2.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    
    </g>
  </g>

  <rect x="2" y="2" width="464" height="192" rx="14" stroke="#1e293b" stroke-width="1.2"/>
</svg>
