<svg xmlns="http://www.w3.org/2000/svg" width="960" height="22" viewBox="0 0 960 22" fill="none" role="presentation">
  <defs>
    <linearGradient id="div-line" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="78%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse-l" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="65%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="20" y1="11" x2="940" y2="11" stroke="url(#div-line)" stroke-width="1.2"/>

  <!-- Shooting photon right -->
  <rect x="480" y="9.5" width="120" height="3" rx="1.5" fill="url(#pulse-r)" filter="url(#div-glow)">
    <animate attributeName="x" values="480;940" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.75;1" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Shooting photon left -->
  <rect x="360" y="9.5" width="120" height="3" rx="1.5" fill="url(#pulse-l)" filter="url(#div-glow)">
    <animate attributeName="x" values="360;-100" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.75;1" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Center diamond core -->
  <g transform="translate(480, 11)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#0b1222" stroke="#34d399" stroke-width="1.4" filter="url(#div-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="r" values="1.6;2.8;1.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
