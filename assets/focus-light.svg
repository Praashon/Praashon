<svg xmlns="http://www.w3.org/2000/svg" width="900" height="202" viewBox="0 0 900 202" fill="none" role="img" aria-label="Disciplines and Current Focus — Praashon Gautam">
  <defs>
    <clipPath id="focus-frame-light">
      <rect x="0.5" y="0.5" width="899" height="201" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .top-draw {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: drawTop 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }
    .col-1 { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both; }
    .col-2 { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.54s both; }
    @keyframes drawTop { to { stroke-dashoffset: 0; } }
    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>

  <g clip-path="url(#focus-frame-light)">
    <rect x="0" y="0" width="900" height="202" fill="#f4f4f0"/>
    <line x1="0" y1="1" x2="900" y2="1" stroke="#15996c" stroke-opacity="0.4" stroke-width="1.5" class="top-draw"/>

    <!-- LEFT COLUMN: STACK & DISCIPLINES -->
    <g class="col-1">
      <text x="28" y="30" class="mono" font-size="10" font-weight="500" fill="#8a8a83" letter-spacing="1.4">02  /  DISCIPLINES</text>

      <text x="28" y="64" class="mono" font-size="11" fill="#15996c">Systems</text>
      <text x="114" y="64" class="sans" font-size="12.5" fill="#2a2a28">Rust, C, WebAssembly, C#, Python</text>
      <line x1="28" y1="79" x2="452" y2="79" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="103" class="mono" font-size="11" fill="#15996c">Interface</text>
      <text x="114" y="103" class="sans" font-size="12.5" fill="#2a2a28">TypeScript, React, Next.js, Tailwind, Three.js, GSAP</text>
      <line x1="28" y1="118" x2="452" y2="118" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="142" class="mono" font-size="11" fill="#15996c">Backend</text>
      <text x="114" y="142" class="sans" font-size="12.5" fill="#2a2a28">Node.js, FastAPI, PostgreSQL, Supabase, Redis, LLMs</text>
      <line x1="28" y1="157" x2="452" y2="157" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="180" class="mono" font-size="11" fill="#15996c">Tooling</text>
      <text x="114" y="180" class="sans" font-size="12.5" fill="#2a2a28">Electron, ADB / SCRCPY, Chrome MV3, Linux</text>
    </g>

    <!-- Center Hairline Divider -->
    <line x1="482" y1="22" x2="482" y2="180" stroke="#e4e4df" stroke-width="1"/>

    <!-- RIGHT COLUMN: CURRENT FOCUS -->
    <g class="col-2">
      <text x="512" y="30" class="mono" font-size="10" font-weight="500" fill="#8a8a83" letter-spacing="1.4">NOW</text>

      <text x="512" y="64" class="mono" font-size="11" fill="#15996c">Building</text>
      <text x="594" y="64" class="sans" font-size="12.5" font-weight="600" fill="#2a2a28">phalanx</text>
      <text x="594" y="82" class="sans" font-size="12" fill="#63635e">Rust compiler, eBPF verifier &amp; zero-alloc VM</text>
      <line x1="512" y1="98" x2="872" y2="98" stroke="#e4e4df" stroke-width="1"/>

      <text x="512" y="122" class="mono" font-size="11" fill="#15996c">Exploring</text>
      <text x="594" y="122" class="sans" font-size="12.5" font-weight="600" fill="#2a2a28">WebAssembly &amp; AI UX</text>
      <text x="594" y="140" class="sans" font-size="12" fill="#63635e">Local-first engines and quiet interfaces</text>
      <line x1="512" y1="157" x2="872" y2="157" stroke="#e4e4df" stroke-width="1"/>

      <text x="512" y="180" class="mono" font-size="11" fill="#15996c">Open to</text>
      <text x="594" y="180" class="sans" font-size="12.5" fill="#2a2a28">Systems, developer tools &amp; product work</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="201" rx="12" stroke="#e4e4df" stroke-width="1"/>
</svg>
