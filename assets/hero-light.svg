<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" fill="none" role="img" aria-label="Praashon Gautam — Building software and visual systems with quiet precision.">
  <defs>
    <clipPath id="hero-frame-light">
      <rect x="0.5" y="0.5" width="899" height="277" rx="14"/>
    </clipPath>
    <pattern id="dot-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1c1917" fill-opacity="0.075"/>
    </pattern>
    <clipPath id="mask-l1-light"><rect x="36" y="88" width="828" height="48"/></clipPath>
    <clipPath id="mask-l2-light"><rect x="36" y="132" width="828" height="48"/></clipPath>
    <clipPath id="mask-l3-light"><rect x="36" y="176" width="828" height="50"/></clipPath>
  </defs>

  <style>
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      letter-spacing: -1.1px;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    /* GSAP expo.out / power4.out masked reveal choreography */
    .rule-draw {
      stroke-dasharray: 828;
      stroke-dashoffset: 828;
      animation: drawLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    }
    .fade-0 { animation: fadeUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both; }
    .fade-1 { animation: fadeUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both; }
    .line-1 { animation: maskSlide 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
    .line-2 { animation: maskSlide 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both; }
    .line-3 { animation: maskSlide 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.38s both; }
    .fade-bio { animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
    .calm-dot { animation: breathe 4s ease-in-out infinite; }

    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes maskSlide {
      from { transform: translateY(42px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#hero-frame-light)">
    <rect x="0" y="0" width="900" height="278" fill="#fafaf8"/>
    <rect x="0" y="0" width="900" height="278" fill="url(#dot-grid-light)"/>

    <!-- Minimal Header Bar -->
    <g class="fade-0">
      <text x="36" y="34" class="sans" font-size="13.5" font-weight="700" fill="#2a2a28">Praashon Gautam</text>
      <circle cx="754" cy="29.5" r="2.8" fill="#15996c" class="calm-dot"/>
      <text x="864" y="34" text-anchor="end" class="mono" font-size="11" fill="#8a8a83">Kathmandu · NPT</text>
    </g>

    <!-- Drawing Hairline Rule -->
    <line x1="36" y1="50" x2="864" y2="50" stroke="#e4e4df" stroke-width="1" class="rule-draw"/>

    <!-- Editorial Kicker -->
    <g class="fade-1">
      <text x="36" y="79" class="mono" font-size="10.5" font-weight="500" fill="#8a8a83" letter-spacing="1.6">01 / PROFILE</text>
      <line x1="146" y1="75" x2="184" y2="75" stroke="#e4e4df" stroke-width="1"/>
      <text x="198" y="79" class="mono" font-size="10.5" font-weight="500" fill="#8a8a83" letter-spacing="1.6">SYSTEMS, FULL-STACK &amp; VISUAL DESIGN</text>
    </g>

    <!-- Masked Line-by-Line Headline -->
    <g clip-path="url(#mask-l1-light)">
      <text x="36" y="128" class="display line-1" font-size="38" font-weight="700" fill="#2a2a28">Building software and</text>
    </g>
    <g clip-path="url(#mask-l2-light)">
      <text x="36" y="172" class="display line-2" font-size="38" font-weight="700" fill="#2a2a28">visual systems with</text>
    </g>
    <g clip-path="url(#mask-l3-light)">
      <text x="36" y="216" class="display line-3" font-size="38" font-weight="700" fill="#15996c">quiet precision.</text>
    </g>

    <!-- Understated Lead Copy -->
    <g class="fade-bio">
      <text x="36" y="250" class="sans" font-size="13.5" fill="#63635e">Developer &amp; designer crafting deterministic Rust/WASM engines, Windows tooling, and resilient web apps.</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="277" rx="14" stroke="#e4e4df" stroke-width="1"/>
</svg>
