      <path d="M 22.0 56.0 C 40.8 56.0, 40.8 50.3, 59.6 50.3 C 78.3 50.3, 78.3 56.0, 97.1 56.0 C 115.9 56.0, 115.9 56.0, 134.7 56.0 C 153.5 56.0, 153.5 48.9, 172.3 48.9 C 191.0 48.9, 191.0 37.6, 209.8 37.6 C 228.6 37.6, 228.6 56.0, 247.4 56.0 C 266.2 56.0, 266.2 22.0, 285.0 22.0 C 303.7 22.0, 303.7 29.1, 322.5 29.1 C 341.3 29.1, 341.3 54.6, 360.1 54.6 C 378.9 54.6, 378.9 56.0, 397.7 56.0 C 416.4 56.0, 416.4 56.0, 435.2 56.0 C 454.0 56.0, 454.0 50.3, 472.8 50.3 C 491.6 50.3, 491.6 39.0, 510.3 39.0 C 529.1 39.0, 529.1 51.8, 547.9 51.8 C 566.7 51.8, 566.7 56.0, 585.5 56.0 C 604.3 56.0, 604.3 56.0, 623.0 56.0 C 641.8 56.0, 641.8 56.0, 660.6 56.0 C 679.4 56.0, 679.4 53.2, 698.2 53.2 C 717.0 53.2, 717.0 51.8, 735.7 51.8 C 754.5 51.8, 754.5 48.9, 773.3 48.9 C 792.1 48.9, 792.1 56.0, 810.9 56.0 C 829.7 56.0, 829.7 56.0, 848.4 56.0 C 867.2 56.0, 867.2 40.4, 886.0 40.4" stroke="url(#ekg-stroke)" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Real Weekly Contribution Nodes -->
      <circle cx="59.6" cy="50.3" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="172.3" cy="48.9" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="209.8" cy="37.6" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="285.0" cy="22.0" r="3.0" fill="#34d399" fill-opacity="0.9"/><circle cx="322.5" cy="29.1" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="360.1" cy="54.6" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="472.8" cy="50.3" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="510.3" cy="39.0" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="547.9" cy="51.8" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="698.2" cy="53.2" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="735.7" cy="51.8" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="773.3" cy="48.9" r="2.1" fill="#38bdf8" fill-opacity="0.9"/><circle cx="886.0" cy="40.4" r="2.1" fill="#38bdf8" fill-opacity="0.9"/>

      <!-- Glowing Tracer Comet Gliding Along Real Commit Curve -->
      <circle r="4.2" fill="#34d399" filter="url(#hud-glow)">
        <animateMotion dur="6.2s" repeatCount="indefinite" path="M 22.0 56.0 C 40.8 56.0, 40.8 50.3, 59.6 50.3 C 78.3 50.3, 78.3 56.0, 97.1 56.0 C 115.9 56.0, 115.9 56.0, 134.7 56.0 C 153.5 56.0, 153.5 48.9, 172.3 48.9 C 191.0 48.9, 191.0 37.6, 209.8 37.6 C 228.6 37.6, 228.6 56.0, 247.4 56.0 C 266.2 56.0, 266.2 22.0, 285.0 22.0 C 303.7 22.0, 303.7 29.1, 322.5 29.1 C 341.3 29.1, 341.3 54.6, 360.1 54.6 C 378.9 54.6, 378.9 56.0, 397.7 56.0 C 416.4 56.0, 416.4 56.0, 435.2 56.0 C 454.0 56.0, 454.0 50.3, 472.8 50.3 C 491.6 50.3, 491.6 39.0, 510.3 39.0 C 529.1 39.0, 529.1 51.8, 547.9 51.8 C 566.7 51.8, 566.7 56.0, 585.5 56.0 C 604.3 56.0, 604.3 56.0, 623.0 56.0 C 641.8 56.0, 641.8 56.0, 660.6 56.0 C 679.4 56.0, 679.4 53.2, 698.2 53.2 C 717.0 53.2, 717.0 51.8, 735.7 51.8 C 754.5 51.8, 754.5 48.9, 773.3 48.9 C 792.1 48.9, 792.1 56.0, 810.9 56.0 C 829.7 56.0, 829.7 56.0, 848.4 56.0 C 867.2 56.0, 867.2 40.4, 886.0 40.4"/>
