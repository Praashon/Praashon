<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" fill="none" role="img" aria-label="Stack and Live GitHub Activity for Praashon">
  <defs>
    <clipPath id="ov-frame-light">
      <rect x="0.5" y="0.5" width="899" height="223" rx="12"/>
    </clipPath>
    <clipPath id="ov-bar-clip-light">
      <rect x="492" y="114" width="0" height="5" rx="2.5">
        <animate attributeName="width" from="0" to="380" dur="1.0s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1" fill="freeze"/>
      </rect>
    </clipPath>
    <linearGradient id="ov-area-light" x1="0" y1="160" x2="0" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15996c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#15996c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .in-1 { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
    .in-2 { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
    .spark-draw {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: strokeDraw 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }
    .area-fade { animation: fadeIn 0.9s ease 0.75s both; }
    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes strokeDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <g clip-path="url(#ov-frame-light)">
    <rect x="0" y="0" width="900" height="224" fill="#f4f4f0"/>

    <!-- LEFT COLUMN: STACK & FOCUS -->
    <g class="in-1">
      <text x="28" y="32" class="mono" font-size="10" font-weight="500" fill="#8a8a83" letter-spacing="1.4">03  /  STACK &amp; DISCIPLINES</text>

      <text x="28" y="68" class="mono" font-size="11" fill="#15996c">Systems</text>
      <text x="114" y="68" class="sans" font-size="12.8" fill="#2a2a28">Rust, C, WebAssembly, C#, Python</text>
      <line x1="28" y1="84" x2="434" y2="84" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="109" class="mono" font-size="11" fill="#15996c">Interface</text>
      <text x="114" y="109" class="sans" font-size="12.8" fill="#2a2a28">TypeScript, React, Next.js, Tailwind, Three.js, GSAP</text>
      <line x1="28" y1="125" x2="434" y2="125" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="150" class="mono" font-size="11" fill="#15996c">Backend</text>
      <text x="114" y="150" class="sans" font-size="12.8" fill="#2a2a28">Node.js, FastAPI, PostgreSQL, Supabase, Redis, LLMs</text>
      <line x1="28" y1="166" x2="434" y2="166" stroke="#e4e4df" stroke-width="1"/>

      <text x="28" y="191" class="mono" font-size="11" fill="#15996c">Tooling</text>
      <text x="114" y="191" class="sans" font-size="12.8" fill="#2a2a28">Electron, ADB / SCRCPY, Chrome MV3, Linux</text>
    </g>

    <!-- Center Hairline Divider -->
    <line x1="462" y1="24" x2="462" y2="200" stroke="#e4e4df" stroke-width="1"/>

    <!-- RIGHT COLUMN: LIVE ACTIVITY -->
    <g class="in-2">
      <text x="492" y="32" class="mono" font-size="10" font-weight="500" fill="#8a8a83" letter-spacing="1.4">ACTIVITY</text>
      <text x="872" y="32" text-anchor="end" class="mono" font-size="10" fill="#8a8a83">Updated Nov 20, 2026</text>

      <!-- 3 Clean Editorial Metrics -->
      <text x="492" y="72" class="sans" font-size="25" font-weight="700" fill="#2a2a28" letter-spacing="-0.6">409</text>
      <text x="492" y="90" class="mono" font-size="9.5" fill="#8a8a83" letter-spacing="1.1">CONTRIBUTIONS</text>

      <text x="634" y="72" class="sans" font-size="25" font-weight="700" fill="#2a2a28" letter-spacing="-0.6">51</text>
      <text x="634" y="90" class="mono" font-size="9.5" fill="#8a8a83" letter-spacing="1.1">PUBLIC REPOS</text>

      <text x="766" y="72" class="sans" font-size="25" font-weight="700" fill="#2a2a28" letter-spacing="-0.6">342</text>
      <text x="766" y="90" class="mono" font-size="9.5" fill="#8a8a83" letter-spacing="1.1">COMMITS (1Y)</text>

      <!-- Slim Language Bar -->
      <rect x="492" y="114" width="380" height="5" rx="2.5" fill="#e4e4df"/>
      <g clip-path="url(#ov-bar-clip-light)">
        <rect x="492.0" y="114" width="167.8" height="5" fill="#2b6cb0"/><rect x="659.8" y="114" width="130.5" height="5" fill="#15996c"/><rect x="790.3" y="114" width="52.1" height="5" fill="#b78428"/><rect x="842.4" y="114" width="15.4" height="5" fill="#b55d35"/><rect x="857.8" y="114" width="14.2" height="5" fill="#3b82a6"/>
      </g>
      <circle cx="495" cy="133" r="2.8" fill="#2b6cb0"/><text x="503" y="136.5" class="mono" font-size="10.2" fill="#63635e">TS 44%</text><circle cx="559" cy="133" r="2.8" fill="#15996c"/><text x="567" y="136.5" class="mono" font-size="10.2" fill="#63635e">C 34%</text><circle cx="623" cy="133" r="2.8" fill="#b78428"/><text x="631" y="136.5" class="mono" font-size="10.2" fill="#63635e">JS 14%</text><circle cx="687" cy="133" r="2.8" fill="#b55d35"/><text x="695" y="136.5" class="mono" font-size="10.2" fill="#63635e">Rust 4%</text><circle cx="754" cy="133" r="2.8" fill="#3b82a6"/><text x="762" y="136.5" class="mono" font-size="10.2" fill="#63635e">Python 4%</text>

