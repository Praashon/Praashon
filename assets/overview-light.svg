      <text x="872" y="210" text-anchor="end" class="mono" font-size="9.2" fill="#8a8a83" letter-spacing="0.8">24-WEEK CADENCE</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="223" rx="12" stroke="#e4e4df" stroke-width="1"/>
